<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>
<style>
body { font-family: Arial; text-align: center; margin-top: 50px; background: #f2f2f2; }
.box { background: white; display: inline-block; padding: 25px; border-radius: 12px; }
input { padding: 10px; margin: 5px; font-size: 16px; width: 130px; }
button { padding: 10px 15px; margin: 5px; font-size: 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 6px; }
#result { font-size: 22px; margin-top: 15px; font-weight: bold; }
</style>
</head>
<body>
<div class="box">
<h2>Calculator - Ayushi</h2>
<input type="number" id="a" placeholder="Pehla number">
<input type="number" id="b" placeholder="Dusra number"><br>
<button onclick="calc('+')">+</button>
<button onclick="calc('-')">-</button>
<button onclick="calc('*')">*</button>
<button onclick="calc('/')">/</button>
<p id="result">Result: </p>
</div>
<script>
function calc(op){
  let a = parseFloat(document.getElementById('a').value);
  let b = parseFloat(document.getElementById('b').value);
  let res;
  if(op=='+') res = a+b;
  if(op=='-') res = a-b;
  if(op=='*') res = a*b;
  if(op=='/') res = (b==0) ? "cannot divide by zero" : a/b;
  document.getElementById('result').innerText = "Result: " + res;
}
</script>
</body>
</html>
